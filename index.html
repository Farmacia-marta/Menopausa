<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algoritmo de Apoio à Decisão - Menopausa</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #006699;
            --primary-dark: #004d73;
            --secondary: #00a88f;
            --bg-body: #f4f7f9;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #d9534f;
            --warning: #f0ad4e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Source Sans Pro', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .top-bar {
            width: 100%;
            max-width: 720px;
            background-color: var(--primary);
            color: #ffffff;
            padding: 12px 20px;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 720px;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--border);
            border-top: none;
            overflow: hidden;
        }

        .header-hero {
            background: linear-gradient(135deg, #006699 0%, #00a88f 100%);
            color: white;
            padding: 24px;
            text-align: center;
        }

        .header-hero h1 {
            font-size: 1.35rem;
            font-weight: 700;
            margin: 0;
        }

        .content {
            padding: 28px 24px;
        }

        .step-tag {
            display: inline-block;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
        }

        .question-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-option {
            background: #ffffff;
            border: 2px solid var(--border);
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 0.98rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-option:hover {
            border-color: var(--primary);
            background-color: #f0f7fa;
            color: var(--primary);
        }

        .binary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .btn-binary {
            text-align: center;
            justify-content: center;
            font-size: 1.1rem;
            padding: 16px;
        }

        .btn-binary.yes:hover {
            background-color: #f0fdf4;
            border-color: #16a34a;
            color: #15803d;
        }

        .btn-binary.no:hover {
            background-color: #fef2f2;
            border-color: #dc2626;
            color: #b91c1c;
        }

        .result-box {
            background-color: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .result-box h3 {
            font-size: 1.15rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .notice-card {
            padding: 16px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .notice-card.urgent {
            background-color: #fef2f2;
            border-left: 5px solid var(--danger);
            color: #991b1b;
        }

        .notice-card.success {
            background-color: #f0fdf4;
            border-left: 5px solid var(--secondary);
            color: #166534;
        }

        .btn-action {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            width: 100%;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 10px;
        }

        .btn-action:hover {
            background-color: var(--primary-dark);
        }

        .btn-secondary-action {
            background-color: #ffffff;
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 12px 20px;
            border-radius: 8px;
            width: 100%;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-secondary-action:hover {
            background-color: #f1f5f9;
        }

        .menqol-tool-box {
            background-color: #f0f7fa;
            border: 1px solid #b3d7e8;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
            text-align: center;
        }

        .menqol-tool-box p {
            font-size: 0.95rem;
            color: var(--primary-dark);
            margin-bottom: 12px;
            font-weight: 600;
        }

        .btn-menqol-link {
            display: inline-block;
            background-color: var(--secondary);
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 700;
            text-decoration: none;
            font-size: 0.9rem;
            transition: background 0.2s;
            cursor: pointer;
        }

        .btn-menqol-link:hover {
            background-color: #008f7a;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <span>ALGORITMO DE DECISÃO CLÍNICA</span>
        <span>SAÚDE NA MENOPAUSA</span>
    </div>

    <div class="container">
        <div class="header-hero">
            <h1>Algoritmo de Apoio à Decisão para Aconselhamento de Produtos de Saúde na Menopausa</h1>
        </div>

        <div class="content" id="appContent">
            <!-- Renderizado dinamicamente via JS -->
        </div>
    </div>

    <script>
        let sessionEvaluations = [];
        let initialAssessmentDone = false;

        const treeData = {
            start: {
                tag: "Triagem Inicial",
                title: "A utente apresenta sintomas associados à menopausa?",
                binary: true,
                yes: { next: "q_idade" },
                no: { result: "Sem indicação para aplicação do protocolo de menopausa. Avaliar outras queixas da utente." }
            },
            q_idade: {
                tag: "Avaliação de Idade",
                title: "A utente tem idade inferior a 45 anos?",
                binary: true,
                yes: { result: "Encaminhamento médico para avaliação de menopausa precoce (<45 anos) ou insuficiência ovárica prematura (<40 anos).", urgent: true },
                no: { next: "q_menqol" }
            },
            q_menqol: {
                tag: "Avaliação de Impacto (MENQOL)",
                title: "Aplicar MENQOL para avaliar sintomas e respetivo impacto na qualidade de vida.<br><br>Os sintomas são graves, persistentes ou apresentam impacto significativo na qualidade de vida?",
                showMenqolButton: true,
                binary: true,
                yes: { result: "Encaminhamento para consulta médica.", urgent: true },
                no: { next: "q_predominante" }
            },
            q_predominante: {
                tag: "Sintoma A Avaliar",
                title: "Qual o sintoma predominante ou principal queixa da utente?",
                options: [
                    { text: "1. Sintomas Vasomotores (Afrontamentos / Suores noturnos)", next: "vasomotores_1" },
                    { text: "2. Sintomas Geniturinários", next: "genitu_1" },
                    { text: "3. Saúde Óssea", next: "ossea_1" },
                    { text: "4. Perturbações do Sono (Insónia inicial, despertares noturnos ou sono não reparador)", next: "sono_1" },
                    { text: "5. Alterações Psicológicas", next: "psico_1" },
                    { text: "6. Alterações Cognitivas", next: "cog_1" },
                    { text: "7. Alterações Metabólicas", next: "meta_1" },
                    { text: "8. Alterações Cutâneas", next: "cut_1" }
                ]
            },

            /* 1. SINTOMAS VASOMOTORES */
            vasomotores_1: {
                tag: "Sintomas Vasomotores",
                title: "Histórico de cancro hormonodependente?",
                binary: true,
                yes: { 
                    result: "Sintomas Vasomotores: Não recomendar fitoestrogénios sem avaliação médica.", 
                    urgent: true,
                    next: "vasomotores_2"
                },
                no: { next: "vasomotores_2" }
            },
            vasomotores_2: {
                tag: "Sintomas Vasomotores",
                title: "A utente é fumadora?",
                binary: true,
                yes: { next: "vasomotores_3" },
                no: { next: "vasomotores_4" }
            },
            vasomotores_3: {
                tag: "Sintomas Vasomotores",
                title: "Informar sobre o possível agravamento dos sintomas vasomotores e promover a cessação tabágica.<br><br>Existe limitação à utilização de fitoestrogénios?",
                binary: true,
                yes: { next: "vasomotores_5" },
                no: { result: "Sintomas Vasomotores: Considerar Isoflavonas de soja (Glycine max) 40–72 mg/dia.", next_eval: "seguimento_1" }
            },
            vasomotores_4: {
                tag: "Sintomas Vasomotores",
                title: "Existe limitação à utilização de fitoestrogénios?",
                binary: true,
                yes: { next: "vasomotores_5" },
                no: { result: "Sintomas Vasomotores: Considerar Isoflavonas de soja (Glycine max) 40–72 mg/dia.", next_eval: "seguimento_1" }
            },
            vasomotores_5: {
                tag: "Sintomas Vasomotores",
                title: "Patologia hepática?",
                binary: true,
                yes: { result: "Sintomas Vasomotores: Evitar erva-de-são-cristóvão (Cimicifuga racemosa). Considerar Extrato de Pólen purificado (ex: 40 mg extrato citoplasmático + 120 mg extrato de pistilo).", next_eval: "seguimento_1" },
                no: { result: "Sintomas Vasomotores: Considerar Extrato de Pólen purificado ou erva-de-são-cristóvão (Cimicifuga racemosa).", next_eval: "seguimento_1" }
            },

            /* 2. SINTOMAS GENITURINÁRIOS */
            genitu_1: {
                tag: "Sintomas Geniturinários",
                title: "Apresenta hemorragia pós-menopausa?",
                binary: true,
                yes: { result: "Sintomas Geniturinários: Encaminhamento médico.", urgent: true },
                no: { next: "genitu_2" }
            },
            genitu_2: {
                tag: "Sintomas Geniturinários",
                title: "Apresenta sintomas sugestivos de infeção urinária ou candidíase?",
                binary: true,
                yes: { result: "Sintomas Geniturinários: Encaminhamento médico.", urgent: true },
                no: { next: "genitu_3" }
            },
            genitu_3: {
                tag: "Sintomas Geniturinários",
                title: "Aconselhar higiene íntima adequada e evitar produtos potencialmente irritantes.<br><br>Apresenta secura, ardor ou desconforto vaginal?",
                binary: true,
                yes: { 
                    result: "Sintomas Geniturinários: Hidratantes Vaginais Não Hormonais (com ácido hialurónico, ácido lático/biotina, pectina). Utilização regular 2 a 3 vezes por semana ou de acordo com a necessidade.", 
                    next_eval: "seguimento_1" 
                },
                no: { next: "genitu_4" }
            },
            genitu_4: {
                tag: "Sintomas Geniturinários",
                title: "Existe dor/desconforto apenas no coito (Dispareunia)?",
                binary: true,
                yes: { 
                    result: "Sintomas Geniturinários: Lubrificantes vaginais (Verificar compatibilidade com preservativos de látex). Utilizar durante a atividade sexual.", 
                    next_eval: "seguimento_1" 
                },
                no: { 
                    result: "Sintomas Geniturinários: Reavaliar sintomatologia.", 
                    next_eval: "seguimento_1" 
                }
            },

            /* 3. SAÚDE ÓSSEA */
            ossea_1: {
                tag: "Saúde Óssea",
                title: "Diagnóstico de osteoporose ou osteopenia?",
                binary: true,
                yes: { result: "Saúde Óssea: Encaminhamento médico e reforço das medidas não farmacológicas de suporte à saúde óssea.", urgent: true },
                no: { next: "ossea_2" }
            },
            ossea_2: {
                tag: "Saúde Óssea",
                title: "Apresenta perda de força muscular?",
                binary: true,
                yes: { next: "ossea_2_sub" },
                no: { next: "ossea_3" }
            },
            ossea_2_sub: {
                tag: "Saúde Óssea",
                title: "Recomendações para Perda de Força Muscular:<br>• Considerar treino de força e resistência.<br>• Considerar creatina monohidratada como complemento, na ausência de contraindicações.<br><br>A utente apresenta também dor articular?",
                binary: true,
                yes: { next: "ossea_3_eval" },
                no: { next: "ossea_4" }
            },
            ossea_3: {
                tag: "Saúde Óssea",
                title: "Apresenta dor articular?",
                binary: true,
                yes: { next: "ossea_3_eval" },
                no: { next: "ossea_4" }
            },
            ossea_3_eval: {
                tag: "Saúde Óssea",
                title: "Avaliação da causa, intensidade, duração e impacto funcional.<br><br>Necessita de encaminhamento médico?",
                binary: true,
                yes: { result: "Saúde Óssea: Encaminhamento médico, se necessário.", urgent: true },
                no: { next: "ossea_4" }
            },
            ossea_4: {
                tag: "Saúde Óssea",
                title: "Ingestão dietética de Cálcio insuficiente (<1200 mg/dia)?",
                binary: true,
                yes: { 
                    result: "Saúde Óssea: Considerar suplementar cálcio para complementar a ingestão diária.", 
                    next: "ossea_vit_d" 
                },
                no: { next: "ossea_vit_d" }
            },
            ossea_vit_d: {
                tag: "Saúde Óssea",
                title: "Níveis de Vitamina D inferiores a 30 ng/mL?",
                binary: true,
                yes: { 
                    result: "Saúde Óssea: Considerar suplementar Vitamina D3 (800-2000 Unidades).", 
                    next_eval: "seguimento_1" 
                },
                no: { 
                    result: "Saúde Óssea: Manter aporte adequado de vitamina D.", 
                    next_eval: "seguimento_1" 
                }
            },

            /* 4. PERTURBAÇÕES DO SONO */
            sono_1: {
                tag: "Perturbações do Sono",
                title: "Está associada a afrontamentos e/ou suores noturnos?",
                binary: true,
                yes: { result: "Perturbações do Sono: Priorizar o alívio de sintomas vasomotores.", next_eval: "seguimento_1" },
                no: { next: "sono_2" }
            },
            sono_2: {
                tag: "Perturbações do Sono",
                title: "Apresenta características sugestivas de outra perturbação do sono secundária? (apneia, nictúria, pernas inquietas)",
                binary: true,
                yes: { result: "Perturbações do Sono: Encaminhamento médico.", urgent: true },
                no: { next: "sono_3" }
            },
            sono_3: {
                tag: "Perturbações do Sono",
                title: "Sintomas de ansiedade, stress ou alterações do humor?",
                binary: true,
                yes: { next: "sono_4" },
                no: { 
                    result: "Perturbações do Sono: Recomendar medidas de Higiene do sono + Considerar suplementação com Melatonina.", 
                    next_eval: "seguimento_1" 
                }
            },
            sono_4: {
                tag: "Perturbações do Sono",
                title: "Apresenta alteração marcada ou persistente, depressão ou ideação suicida?",
                binary: true,
                yes: { result: "Perturbações do Sono: Encaminhamento médico.", urgent: true },
                no: { 
                    result: "Perturbações do Sono: Recomendar medidas de higiene do sono e estratégias de gestão do stress + Considerar Valeriana officinalis + Melatonina.", 
                    next_eval: "seguimento_1" 
                }
            },

            /* 5. ALTERAÇÕES PSICOLÓGICAS */
            psico_1: {
                tag: "Alterações Psicológicas",
                title: "Alteração marcada ou persistente, depressão ou ideação suicida?",
                binary: true,
                yes: { result: "Alterações Psicológicas: Encaminhamento médico.", urgent: true },
                no: { next: "psico_2" }
            },
            psico_2: {
                tag: "Alterações Psicológicas",
                title: "Apresenta irritabilidade ou alterações ligeiras do humor?<br>(Aplicação de medidas gerais de suporte: exercício físico, sono, gestão do stress e apoio psicológico)",
                binary: true,
                yes: { next: "psico_3" },
                no: { next: "psico_3" }
            },
            psico_3: {
                tag: "Alterações Psicológicas",
                title: "Suspeita de défice nutricional ou ingestão alimentar insuficiente de vitaminas do complexo B?",
                binary: true,
                yes: { next: "psico_4" },
                no: { result: "Alterações Psicológicas: Manter medidas gerais de suporte: exercício físico, higiene do sono, gestão do stress e apoio psicológico.", next_eval: "seguimento_1" }
            },
            psico_4: {
                tag: "Alterações Psicológicas",
                title: "Necessidade de avaliação analítica. Encaminhamento médico quando necessário.<br><br>Défice de Vit. B confirmado?",
                binary: true,
                yes: { result: "Alterações Psicológicas: Considerar vitaminas do complexo B.", next_eval: "seguimento_1" },
                no: { result: "Alterações Psicológicas: Manter medidas gerais de suporte: exercício físico, higiene do sono, gestão do stress e apoio psicológico.", next_eval: "seguimento_1" }
            },

            /* 6. ALTERAÇÕES COGNITIVAS */
            cog_1: {
                tag: "Alterações Cognitivas",
                title: "Sintomas graves e/ou incapacitantes?",
                binary: true,
                yes: { result: "Alterações Cognitivas: Encaminhamento médico.", urgent: true },
                no: { next: "cog_2" }
            },
            cog_2: {
                tag: "Alterações Cognitivas",
                title: "Alterações cognitivas ligeiras ou queixas de memória?",
                binary: true,
                yes: { next: "cog_3" },
                no: { result: "Alterações Cognitivas: Reavaliar sintomatologia.", next_eval: "seguimento_1" }
            },
            cog_3: {
                tag: "Alterações Cognitivas",
                title: "Reforçar medidas de higiene do sono e gestão do stress.<br><br>Consumo adequado de peixe gordo? (2 a 3 vezes por semana)",
                binary: true,
                yes: { result: "Alterações Cognitivas: Manter aporte alimentar.", next_eval: "seguimento_1" },
                no: { result: "Alterações Cognitivas: Considerar suplementação com Ómega 3 (DHA e EPA).", next_eval: "seguimento_1" }
            },

            /* 7. ALTERAÇÕES METABÓLICAS */
            meta_1: {
                tag: "Alterações Metabólicas",
                title: "Índice de Massa Corporal (IMC) > 27?",
                binary: true,
                yes: { next: "meta_bmi_high" },
                no: { next: "meta_2" }
            },
            meta_bmi_high: {
                tag: "Alterações Metabólicas",
                title: "Recomendações: Considerar perda de peso, Exercício regular de força e resistência, Sugerir consulta de nutrição.<br><br>Apresenta Triglicéridos Altos ou Risco Cardiovascular Elevado?",
                binary: true,
                yes: { next: "meta_cv_high" },
                no: { next: "meta_3" }
            },
            meta_2: {
                tag: "Alterações Metabólicas",
                title: "Triglicéridos Altos ou Risco Cardiovascular Elevado?",
                binary: true,
                yes: { next: "meta_cv_high" },
                no: { next: "meta_3" }
            },
            meta_cv_high: {
                tag: "Alterações Metabólicas",
                title: "Reforçar intervenção nutricional.<br><br>Consumo adequado de peixe gordo? (2 a 3 vezes por semana)",
                binary: true,
                yes: { result: "Alterações Metabólicas: Manter aporte alimentar.", next: "meta_3" },
                no: { result: "Alterações Metabólicas: Considerar suplementação com Ómega 3 (DHA e EPA).", next: "meta_3" }
            },
            meta_3: {
                tag: "Alterações Metabólicas",
                title: "Diabetes Mellitus 2?",
                binary: true,
                yes: { result: "Alterações Metabólicas: Encaminhar para consulta médica.", urgent: true },
                no: { result: "Alterações Metabólicas: Manter medidas gerais de promoção da saúde metabólica.", next_eval: "seguimento_1" }
            },

            /* 8. ALTERAÇÕES CUTÂNEAS */
            cut_1: {
                tag: "Alterações Cutâneas",
                title: "Proteção Solar Diária (Prevenção do Fotoenvelhecimento).<br><br>Apresenta secura e/ou prurido?",
                binary: true,
                yes: { result: "Alterações Cutâneas: Considerar emolientes de base pH e Ácido Hialurónico tópico (para reter humidade).", next: "cut_2" },
                no: { next: "cut_2" }
            },
            cut_2: {
                tag: "Alterações Cutâneas",
                title: "Perda de elasticidade, rugas ou flacidez?",
                binary: true,
                yes: { result: "Alterações Cutâneas: Considerar dermocosméticos que estimulem a síntese de colagénio.", next: "cut_3" },
                no: { next: "cut_3" }
            },
            cut_3: {
                tag: "Alterações Cutâneas",
                title: "Apresenta queda de cabelo ou perda de volume?",
                binary: true,
                yes: { next: "cut_4" },
                no: { result: "Alterações Cutâneas: Dermocosméticos capilares específicos.", next_eval: "seguimento_1" }
            },
            cut_4: {
                tag: "Alterações Cutâneas",
                title: "Queda de cabelo persistente ou com sinais de alarme?",
                binary: true,
                yes: { result: "Alterações Cutâneas: Encaminhamento médico/dermatológico.", urgent: true },
                no: { result: "Alterações Cutâneas: Queda transitória ou sazonal - Considerar abordagem dermocosmética.", next_eval: "seguimento_1" }
            },

            /* SEGUIMENTO E REAVALIAÇÃO */
            seguimento_1: {
                tag: "Seguimento e Reavaliação",
                title: "Após o período de acompanhamento: Verifica-se ausência de melhoria ou agravamento dos sintomas?",
                binary: true,
                yes: { result: "Seguimento e Reavaliação: Encaminhamento médico.", urgent: true },
                no: { result: "Seguimento e Reavaliação: Manter medidas recomendadas e acompanhamento." }
            }
        };

        function renderNode(nodeKey) {
            const app = document.getElementById('appContent');
            const node = treeData[nodeKey];

            if (!node) return;

            if (nodeKey === 'start' && initialAssessmentDone) {
                renderNode('q_predominante');
                return;
            }

            let html = `<span class="step-tag">${node.tag}</span>`;
            html += `<h2 class="question-title">${node.title}</h2>`;

            if (node.showMenqolButton) {
                html += `
                    <div class="menqol-tool-box">
                        <p>Ainda não calculou o impacto dos sintomas com a utente?</p>
                        <a href="#" class="btn-menqol-link" onclick="openMenqolForm(event)">📋 Abrir Questionário MENQOL em nova janela</a>
                    </div>
                `;
            }

            if (node.binary) {
                html += `
                    <div class="binary-grid">
                        <button class="btn-option btn-binary yes" onclick="handleSelect('${nodeKey}', 'yes')">Sim</button>
                        <button class="btn-option btn-binary no" onclick="handleSelect('${nodeKey}', 'no')">Não</button>
                    </div>
                `;
            } else if (node.options) {
                html += `<div class="options-list">`;
                node.options.forEach((opt, idx) => {
                    html += `<button class="btn-option" onclick="handleSelect('${nodeKey}', ${idx})">${opt.text} <span>→</span></button>`;
                });
                html += `</div>`;
            }

            app.innerHTML = html;
        }

        function openMenqolForm(e) {
            e.preventDefault();
            const items = [
                "1. Sensação de afrontamento ou de mal-estar",
                "2. Suores noturnos",
                "3. Suar",
                "4. Sentir-se insatisfeita com a sua vida pessoal",
                "5. Sentir ansiedade ou nervosismo",
                "6. Ter perda de memória",
                "7. Não conseguir fazer as coisas que fazia habitualmente",
                "8. Sentir-se deprimida ou \"em baixo\"",
                "9. Ficar impaciente com as outras pessoas",
                "10. Sentir vontade de estar sozinha",
                "11. Flatulência (gases) ou dores associadas (ex: cólicas)",
                "12. Dores nos músculos e ligamentos/articulações",
                "13. Sentir-se cansada ou esgotada",
                "14. Dificuldades em dormir",
                "15. Dores na parte de trás do pescoço ou na cabeça",
                "16. Diminuição da força física",
                "17. Diminuição da resistência e da energia física",
                "18. Sentir falta de energia fisicamente",
                "19. Ter a pele seca",
                "20. Aumentar de peso",
                "21. Aumento do pelo facial",
                "22. Alterações na aparência, textura ou aspeto da sua pele",
                "23. Sentir-se \"inchada\"",
                "24. Dores no fundo das costas",
                "25. Urinar frequentemente",
                "26. Urinar involuntariamente quando ri ou tosse",
                "27. Alteração do seu desejo sexual",
                "28. Secura vaginal quando tem relações sexuais",
                "29. Evitamento de intimidade sexual"
            ];

            let tableRows = items.map((item, index) => {
                let options = '';
                for(let i=0; i<=6; i++) {
                    options += `<label style="margin: 0 3px; font-size: 0.82rem; cursor: pointer;"><input type="radio" name="scale_${index}" value="${i}"> ${i}</label>`;
                }
                return `
                    <tr style="border-bottom: 1px solid #e2e8f0;">
                        <td style="padding: 6px 8px; font-size: 0.85rem;">${item}</td>
                        <td style="padding: 6px 8px; text-align: center; white-space: nowrap;">
                            <label style="margin-right: 6px; font-size: 0.82rem;"><input type="radio" name="presenc_${index}" value="nao" onclick="disableScale(${index})"> Não</label>
                            <label style="font-size: 0.82rem;"><input type="radio" name="presenc_${index}" value="sim" onclick="enableScale(${index})"> Sim</label>
                        </td>
                        <td style="padding: 6px 8px; text-align: center; white-space: nowrap;" id="scale_container_${index}">
                            ${options}
                        </td>
                    </tr>
                `;
            }).join('');

            const menqolHtml = `
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>QQVM / MENQOL - Avaliação de Resultados</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Source Sans Pro', sans-serif; background: #f4f7f9; padding: 15px; color: #2c3e50; }
        .box { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #006699; text-align: center; margin-bottom: 5px; font-size: 1.4rem; }
        p.subtitle { text-align: center; font-size: 0.9rem; color: #64748b; margin-bottom: 15px; }
        .patient-info { display: flex; gap: 15px; margin-bottom: 15px; padding: 10px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; }
        .patient-info input { padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 0.9rem; flex: 1; }
        .instructions { background: #f0f7fa; border-left: 4px solid #006699; padding: 10px; margin-bottom: 15px; font-size: 0.85rem; line-height: 1.4; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th { background: #006699; color: white; padding: 8px; font-size: 0.82rem; text-align: left; }
        .scale-header { display: flex; justify-content: space-between; font-size: 0.75rem; font-weight: bold; color: #ffffff; }
        .btn-container { text-align: center; margin-top: 20px; display: flex; justify-content: center; gap: 10px; }
        .btn { border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
        .btn-print { background: #00a88f; color: white; }
        .btn-print:hover { background: #008f7a; }
        .btn-close { background: #64748b; color: white; }
        .btn-close:hover { background: #475569; }
        
        @media print {
            body { background: white; padding: 0; }
            .box { box-shadow: none; border: none; padding: 0; max-width: 100%; }
            .btn-container, .instructions { display: none !important; }
            .patient-info { border: none; padding: 0; margin-bottom: 20px; }
            .patient-info input { border: none; border-bottom: 1px solid #000; border-radius: 0; }
            th { background: #2c3e50 !important; color: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>| QQVM | Mulheres Pós-Menopausa</h2>
        <p class="subtitle">Questionário de Qualidade de Vida na Menopausa (MENQOL)</p>

        <div class="patient-info">
            <input type="text" placeholder="Nome da Utente / ID:">
            <input type="date" value="${new Date().toISOString().split('T')[0]}">
        </div>

        <div class="instructions">
            Indique se experienciou o problema no <strong>PASSADO MÊS</strong>. Se teve o referido problema, indique o quanto se sentiu incomodada numa escala de 0 (Nada) a 6 (Extremamente).
        </div>

        <form id="menqolForm">
            <table>
                <thead>
                    <tr>
                        <th style="width: 45%;">Item / Sintoma</th>
                        <th style="width: 15%; text-align: center;">Presença</th>
                        <th style="width: 40%; text-align: center;">
                            <div class="scale-header">
                                <span>0 (Nada)</span>
                                <span>6 (Extremamente)</span>
                            </div>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    ${tableRows}
                </tbody>
            </table>
        </form>

        <div class="btn-container">
            <button type="button" class="btn btn-print" onclick="window.print()">🖨️ Imprimir / Salvar em PDF</button>
            <button type="button" class="btn btn-close" onclick="window.close()">Fechar</button>
        </div>
    </div>

    <script>
        function disableScale(index) {
            const radios = document.getElementsByName('scale_' + index);
            radios.forEach(r => { r.checked = false; r.disabled = true; });
        }
        function enableScale(index) {
            const radios = document.getElementsByName('scale_' + index);
            radios.forEach(r => { r.disabled = false; });
        }
    <\/script>
</body>
</html>
            `;
            const win = window.open("", "_blank", "width=950,height=800,scrollbars=yes");
            win.document.write(menqolHtml);
            win.document.close();
        }

        function handleSelect(nodeKey, choice) {
            const node = treeData[nodeKey];
            let target;

            if (node.binary) {
                target = node[choice];
            } else if (node.options) {
                target = node.options[choice];
            }

            if (nodeKey === 'q_menqol' && choice === 'no') {
                initialAssessmentDone = true;
            }

            if (target.result) {
                sessionEvaluations.push({ text: target.result, isUrgent: target.urgent });
                
                if (target.next) {
                    renderNode(target.next);
                } else if (target.next_eval) {
                    renderNode(target.next_eval);
                } else {
                    showResult();
                }
            } else if (target.next) {
                renderNode(target.next);
            }
        }

        function showResult() {
            const app = document.getElementById('appContent');

            let html = `<h2 class="question-title" style="text-align: center; margin-bottom: 16px;">Recomendações Clínicas da Utente</h2>`;
            
            sessionEvaluations.forEach((item, index) => {
                const cardClass = item.isUrgent ? 'urgent' : 'success';
                const cardTitle = item.isUrgent ? '🔴 Encaminhamento / Recomendação Clínica' : '💊 Orientação / Aconselhamento Farmacêutico';
                
                html += `
                    <div class="result-box">
                        <h3>${cardTitle} #${index + 1}</h3>
                        <div class="notice-card ${cardClass}">
                            ${item.text}
                        </div>
                    </div>
                `;
            });

            html += `
                <button class="btn-action" onclick="renderNode('q_predominante')">➕ Avaliar Outro Sintoma da Utente</button>
                <button class="btn-secondary-action" onclick="resetFullSession()">🔄 Iniciar Nova Utente (Limpar Tudo)</button>
            `;

            app.innerHTML = html;
        }

        function resetFullSession() {
            sessionEvaluations = [];
            initialAssessmentDone = false;
            renderNode('start');
        }

        renderNode('start');
    </script>

</body>
</html>
