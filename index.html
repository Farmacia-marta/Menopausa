<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algoritmo de Apoio à Decisão - Menopausa</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #006699;
            --primary-dark: #004d73;
            --secondary: #00a88f;
            --bg-body: #f4f7f9;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --border: #e2e8f0;
            --danger: #d9534f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Source Sans Pro', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .header-hero {
            background: linear-gradient(135deg, #006699 0%, #00a88f 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header-hero h1 {
            font-size: 1.15rem;
            font-weight: 700;
            line-height: 1.3;
        }

        .header-hero p {
            font-size: 0.8rem;
            opacity: 0.9;
            margin-top: 4px;
        }

        .content {
            padding: 24px 20px;
        }

        .step-tag {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: #006699;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 12px;
        }

        .advice-text {
            font-size: 0.95rem;
            font-weight: 600;
            color: #1e293b;
            line-height: 1.4;
            margin-bottom: 16px;
            background-color: #f1f5f9;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
        }

        .question-title {
            font-size: 1rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-option {
            background: #ffffff;
            border: 1.5px solid var(--border);
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-option:hover {
            border-color: var(--primary);
            background-color: #f0f7fa;
            color: var(--primary);
        }

        .binary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-binary {
            text-align: center;
            justify-content: center;
            font-size: 1rem;
            padding: 12px;
            border-radius: 10px;
            background: #ffffff;
            border: 1.5px solid var(--border);
            font-weight: 600;
            cursor: pointer;
        }

        .btn-binary:hover {
            border-color: var(--primary);
            background-color: #f0f7fa;
        }

        .notice-card {
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            line-height: 1.4;
            font-weight: 600;
        }

        .notice-card.urgent {
            background-color: #fef2f2;
            border-left: 5px solid var(--danger);
            color: #991b1b;
        }

        .notice-card.success {
            background-color: #f0fdf4;
            border-left: 5px solid var(--secondary);
            color: #166534;
        }

        .btn-action {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            width: 100%;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }

        .report-header {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1e293b;
            text-align: center;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-hero">
            <h1>Aconselhamento de Produtos de Saúde na Menopausa</h1>
            <p>Triagem orientada segundo o protocolo oficial de intervenção farmacêutica</p>
        </div>

        <div class="content" id="appContent">
            <!-- Conteúdo carregado via JS -->
        </div>
    </div>

    <script>
        const treeData = {
            /* TRIAGEM INICIAL */
            start: {
                tag: "Triagem Inicial",
                title: "A utente apresenta sintomas associados à menopausa?",
                binary: true,
                yes: { next: "q_idade" },
                no: { result: "Sem indicação para aplicação do protocolo de menopausa." }
            },
            q_idade: {
                tag: "Avaliação de Idade",
                title: "A utente tem idade inferior a 45 anos?",
                binary: true,
                yes: { result: "Encaminhamento médico para avaliação de menopausa precoce (<45 anos) ou insuficiência ovárica prematura (<40 anos).", urgent: true },
                no: { next: "q_menqol" }
            },
            q_menqol: {
                tag: "Avaliação MENQOL",
                advice: "Aplicar MENQOL para avaliar sintomas e impacto/comparticipação na qualidade de vida.",
                title: "Os sintomas são graves, persistentes ou apresentam impacto significativo na qualidade de vida?",
                binary: true,
                yes: { result: "Encaminhamento para consulta médica.", urgent: true },
                no: { next: "q_predominante" }
            },
            q_predominante: {
                tag: "Sintoma A Avaliar",
                title: "Qual o sintoma predominante ou principal queixa da utente?",
                options: [
                    { text: "1. Sintomas Vasomotores", next: "vasomotores_1" },
                    { text: "2. Sintomas Geniturinários", next: "genitu_1" },
                    { text: "3. Saúde Óssea", next: "ossea_1" },
                    { text: "4. Perturbações do Sono", next: "sono_1" },
                    { text: "5. Alterações Psicológicas", next: "psico_1" },
                    { text: "6. Alterações Cognitivas", next: "cogni_1" },
                    { text: "7. Alterações Metabólicas", next: "meta_1" },
                    { text: "8. Alterações Cutâneas", next: "cutan_1" }
                ]
            },

            /* 1. SINTOMAS VASOMOTORES */
            vasomotores_1: {
                tag: "Sintomas Vasomotores",
                title: "Histórico de cancro hormonodependente?",
                binary: true,
                yes: { result: "Não recomendar fitoestrogénios sem avaliação médica.", urgent: true },
                no: { next: "vasomotores_2" }
            },
            vasomotores_2: {
                tag: "Sintomas Vasomotores",
                title: "A utente é fumadora?",
                binary: true,
                yes: { advice: "Informar sobre o possível agravamento dos sintomas vasomotores e promover a cessação tabágica.", next: "vasomotores_3" },
                no: { next: "vasomotores_3" }
            },
            vasomotores_3: {
                tag: "Sintomas Vasomotores",
                title: "Existe limitação à utilização de fitoestrogénios?",
                binary: true,
                yes: { next: "vasomotores_4" },
                no: { result: "Considerar Isoflavonas de soja (Glycine max) 40–72 mg/dia." }
            },
            vasomotores_4: {
                tag: "Sintomas Vasomotores",
                title: "Apresenta patologia hepática?",
                binary: true,
                yes: { result: "Evitar erva-de-são-cristóvão (Cimicifuga racemosa). Considerar Extrato de Pólen purificado (ex: 320 mg/dia de extrato de pólen estaminal + 160 mg extrato de pólen/pistilo)." },
                no: { result: "Considerar Extrato de Pólen purificado OU erva-de-são-cristóvão (Cimicifuga racemosa)." }
            },

            /* 2. SINTOMAS GENITURINÁRIOS */
            genitu_1: {
                tag: "Sintomas Geniturinários",
                title: "Apresenta hemorragia pós-menopausa?",
                binary: true,
                yes: { result: "Encaminhamento médico.", urgent: true },
                no: { next: "genitu_2" }
            },
            genitu_2: {
                tag: "Sintomas Geniturinários",
                title: "Apresenta sintomas sugestivos de infeção urinária ou reincidentes?",
                binary: true,
                yes: { result: "Encaminhamento médico.", urgent: true },
                no: { advice: "Aconselhar higiene íntima adequada e evitar produtos potencialmente irritantes.", next: "genitu_3" }
            },
            genitu_3: {
                tag: "Sintomas Geniturinários",
                title: "Apresenta secura, ardor ou desconforto vaginal?",
                binary: true,
                yes: { result: "Hidratantes Vaginais Não Hormonais (Ácido hialurónico, ácido policarbófilo, pectina). Utilização regular: 2 a 3 vezes por semana ou de acordo com a necessidade." },
                no: { next: "genitu_4" }
            },
            genitu_4: {
                tag: "Sintomas Geniturinários",
                title: "Existe dor/desconforto apenas no coito (dispareunia)?",
                binary: true,
                yes: { result: "Lubrificantes vaginais. Verificar compatibilidade com preservativos de látex. Utilizar durante a atividade sexual." },
                no: { result: "Prevenir sintomatologia." }
            },

            /* 3. SAÚDE ÓSSEA */
            ossea_1: {
                tag: "Saúde Óssea",
                title: "Diagnóstico de osteoporose ou osteopenia?",
                binary: true,
                yes: { result: "Encaminhamento médico e reforço das medidas não farmacológicas de suporte à saúde óssea.", urgent: true },
                no: { next: "ossea_2" }
            },
            ossea_2: {
                tag: "Saúde Óssea",
                title: "Apresenta perda de força muscular?",
                binary: true,
                yes: { advice: "Considerar treino de força e resistência. Considerar creatina monohidratada como complemento na ausência de contraindicações.", next: "ossea_3" },
                no: { next: "ossea_3" }
            },
            ossea_3: {
                tag: "Saúde Óssea",
                title: "Apresenta dor lombar?",
                binary: true,
                yes: { advice: "Avaliação da causa, intensidade, duração e impacto funcional. Encaminhamento médico, se necessário.", next: "ossea_4" },
                no: { next: "ossea_4" }
            },
            ossea_4: {
                tag: "Saúde Óssea",
                title: "Ingestão dietética de Cálcio insuficiente (<1200 mg/dia)?",
                binary: true,
                yes: { advice: "Considerar suplementar cálcio para completar a ingestão diária.", next: "ossea_5" },
                no: { next: "ossea_5" }
            },
            ossea_5: {
                tag: "Saúde Óssea",
                title: "Níveis de Vitamina D inferiores a 30 ng/mL?",
                binary: true,
                yes: { result: "Considerar suplementar Vitamina D3 (800-2000 Unidades)." },
                no: { result: "Manter aporte adequado de vitamina D." }
            },

            /* 4. PERTURBAÇÕES DO SONO */
            sono_1: {
                tag: "Perturbações do Sono",
                title: "Está associada a afrontamentos e/ou suores noturnos?",
                binary: true,
                yes: { result: "Priorizar o tratamento dos sintomas vasomotores." },
                no: { next: "sono_2" }
            },
            sono_2: {
                tag: "Perturbações do Sono",
                title: "Apresenta sintomas sugestivos de causa psiquiátrica/orgânica (ex.: apneia, pernas inquietas)?",
                binary: true,
                yes: { result: "Encaminhamento médico.", urgent: true },
                no: { next: "sono_3" }
            },
            sono_3: {
                tag: "Perturbações do Sono",
                title: "Sintomas de ansiedade, stresse ou alterações de humor?",
                binary: true,
                yes: { next: "sono_4" },
                no: { result: "Considerar medidas de higiene do sono. Considerar melatonina." }
            },
            sono_4: {
                tag: "Perturbações do Sono",
                title: "Alteração marcada ou proeminente, dependendo da situação clínica?",
                binary: true,
                yes: { result: "Encaminhamento médico.", urgent: true },
                no: { result: "Medidas de higiene do sono e estratégias de gestão do stresse. Considerar Valeriana / Passiflora + melatonina." }
            },

            /* 5. ALTERAÇÕES PSICOLÓGICAS */
            psico_1: {
                tag: "Alterações Psicológicas",
                title: "Alteração marcada e persistente, depressão ou ideação suicida?",
                binary: true,
                yes: { result: "Encaminhamento médico.", urgent: true },
                no: { advice: "Medidas gerais de suporte: exercício físico, sono, gestão de stresse e apoio psicológico.", next: "psico_2" }
            },
            psico_2: {
                tag: "Alterações Psicológicas",
                title: "Suspeita de défice nutricional ou ingestão alimentar insuficiente de vitaminas do complexo B?",
                binary: true,
                yes: { advice: "Necessidade de avaliação analítica. Encaminhamento médico, quando necessário.", next: "psico_3" },
                no: { result: "Manter medidas gerais de suporte: exercício físico, higiene do sono, gestão de stresse e apoio psicológico." }
            },
            psico_3: {
                tag: "Alterações Psicológicas",
                title: "Défice de Vitamina B confirmado?",
                binary: true,
                yes: { result: "Considerar vitaminas do complexo B." },
                no: { result: "Manter medidas gerais de suporte: exercício físico, higiene do sono, gestão de stresse e apoio psicológico." }
            },

            /* 6. ALTERAÇÕES COGNITIVAS */
            cogni_1: {
                tag: "Alterações Cognitivas",
                title: "Sintomas graves e/ou incapacitantes?",
                binary: true,
                yes: { result: "Encaminhamento médico.", urgent: true },
                no: { next: "cogni_2" }
            },
            cogni_2: {
                tag: "Alterações Cognitivas",
                title: "Alterações cognitivas ligeiras ou perda de memória?",
                binary: true,
                yes: { advice: "Reforçar medidas de higiene do sono e gestão do stresse.", next: "cogni_3" },
                no: { result: "Prevenir sintomatologia." }
            },
            cogni_3: {
                tag: "Alterações Cognitivas",
                title: "Consumo adequado de peixe gordo (2 a 3 vezes por semana)?",
                binary: true,
                yes: { result: "Manter aporte alimentar." },
                no: { result: "Considerar suplementação com Ómega 3 (DHA e EPA)." }
            },

            /* 7. ALTERAÇÕES METABÓLICAS */
            meta_1: {
                tag: "Alterações Metabólicas",
                title: "Índice de Massa Corporal (IMC) > 27?",
                binary: true,
                yes: { result: "Considerar perda de peso. Exercício regular de força e resistência. Sugerir consulta de nutrição." },
                no: { next: "meta_2" }
            },
            meta_2: {
                tag: "Alterações Metabólicas",
                title: "Triglicéridos altos ou Risco Cardiovascular Elevado?",
                binary: true,
                yes: { advice: "Reforçar intervenção nutricional.", next: "meta_3" },
                no: { next: "meta_4" }
            },
            meta_3: {
                tag: "Alterações Metabólicas",
                title: "Consumo adequado de peixe gordo (2 a 3 vezes por semana)?",
                binary: true,
                yes: { result: "Manter aporte alimentar." },
                no: { result: "Considerar suplementação com Ómega 3 (DHA e EPA)." }
            },
            meta_4: {
                tag: "Alterações Metabólicas",
                title: "Diabetes mellitus?",
                binary: true,
                yes: { result: "Encaminhar para consulta médica.", urgent: true },
                no: { result: "Manter medidas gerais de promoção da saúde metabólica." }
            },

            /* 8. ALTERAÇÕES CUTÂNEAS */
            cutan_1: {
                tag: "Alterações Cutâneas",
                advice: "Proteção Solar Diária (Prevenção do Fotoenvelhecimento).",
                title: "Apresenta secura e/ou prurido?",
                binary: true,
                yes: { result: "Considerar emolientes de baixo pH e dermo-cosméticos tópicos (para reter humidade)." },
                no: { next: "cutan_2" }
            },
            cutan_2: {
                tag: "Alterações Cutâneas",
                title: "Perda de elasticidade, firmeza/flacidez?",
                binary: true,
                yes: { result: "Considerar dermo-cosméticos que estimulem a síntese de colagénio." },
                no: { next: "cutan_3" }
            },
            cutan_3: {
                tag: "Alterações Cutâneas",
                title: "Apresenta queda de cabelo ou perda de volume?",
                binary: true,
                yes: { next: "cutan_4" },
                no: { result: "Dermo-cosméticos capilares específicos." }
            },
            cutan_4: {
                tag: "Alterações Cutâneas",
                title: "Queda de cabelo é persistente ou com sinais de alopécia?",
                binary: true,
                yes: { result: "Encaminhamento médico/dermatológico.", urgent: true },
                no: { result: "Queda de cabelo sazonal: Considerar abordagem dermo-cosmética." }
            },

            /* SEGUIMENTO E REAVALIAÇÃO */
            seguimento: {
                tag: "Seguimento e Reavaliação",
                title: "Ausência de melhoria ou agravamento dos sintomas?",
                binary: true,
                yes: { result: "Encaminhamento médico.", urgent: true },
                no: { result: "Manter medidas recomendadas e acompanhamento." }
            }
        };

        function renderNode(nodeKey) {
            const app = document.getElementById('appContent');
            const node = treeData[nodeKey];

            if (!node) return;

            // Se for ecrã de Resultado Final
            if (node.result) {
                const cardClass = node.urgent ? 'urgent' : 'success';
                app.innerHTML = `
                    <div class="report-header">Recomendações Clínicas da Utente</div>
                    <div class="notice-card ${cardClass}">
                        ${node.result}
                    </div>
                    <button class="btn-action" onclick="renderNode('q_predominante')">➕ Avaliar Outro Sintoma</button>
                    <button class="btn-action" style="background-color: #00a88f;" onclick="renderNode('seguimento')">📋 Seguimento e Reavaliação</button>
                    <button class="btn-action" style="background-color: #64748b;" onclick="renderNode('start')">🔄 Nova Utente</button>
                `;
                return;
            }

            // Ecrã normal de pergunta
            let html = `<span class="step-tag">${node.tag}</span>`;

            if (node.advice) {
                html += `<div class="advice-text">${node.advice}</div>`;
            }

            if (node.title) {
                html += `<h2 class="question-title">${node.title}</h2>`;
            }

            if (node.binary) {
                html += `
                    <div class="binary-grid">
                        <button class="btn-binary" onclick="handleSelect('${nodeKey}', 'yes')">Sim</button>
                        <button class="btn-binary" onclick="handleSelect('${nodeKey}', 'no')">Não</button>
                    </div>
                `;
            } else if (node.options) {
                html += `<div class="options-list">`;
                node.options.forEach((opt, idx) => {
                    html += `<button class="btn-option" onclick="handleSelect('${nodeKey}', ${idx})">${opt.text} <span>→</span></button>`;
                });
                html += `</div>`;
            }

            app.innerHTML = html;
        }

        function handleSelect(nodeKey, choice) {
            const node = treeData[nodeKey];
            let target;

            if (node.binary) {
                target = node[choice];
            } else if (node.options) {
                target = node.options[choice];
            }

            if (target.next) {
                renderNode(target.next);
            } else if (target.result) {
                const app = document.getElementById('appContent');
                const cardClass = target.urgent ? 'urgent' : 'success';
                app.innerHTML = `
                    <div class="report-header">Recomendações Clínicas da Utente</div>
                    <div class="notice-card ${cardClass}">
                        ${target.result}
                    </div>
                    <button class="btn-action" onclick="renderNode('q_predominante')">➕ Avaliar Outro Sintoma</button>
                    <button class="btn-action" style="background-color: #00a88f;" onclick="renderNode('seguimento')">📋 Seguimento e Reavaliação</button>
                    <button class="btn-action" style="background-color: #64748b;" onclick="renderNode('start')">🔄 Nova Utente</button>
                `;
            }
        }

        renderNode('start');
    </script>

</body>
</html>
