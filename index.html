<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algoritmo de Apoio à Decisão - Menopausa</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #006699;
            --primary-dark: #004d73;
            --secondary: #00a88f;
            --bg-body: #f4f7f9;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --border: #e2e8f0;
            --danger: #d9534f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Source Sans Pro', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 450px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .header-hero {
            background: linear-gradient(135deg, #006699 0%, #00a88f 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header-hero h1 {
            font-size: 1.15rem;
            font-weight: 700;
            line-height: 1.3;
        }

        .header-hero p {
            font-size: 0.8rem;
            opacity: 0.9;
            margin-top: 4px;
        }

        .content {
            padding: 24px 20px;
        }

        .step-tag {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: #006699;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 12px;
        }

        .advice-text {
            font-size: 1rem;
            font-weight: 700;
            color: #1e293b;
            line-height: 1.4;
            margin-bottom: 16px;
        }

        .question-title {
            font-size: 1rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-option {
            background: #ffffff;
            border: 1.5px solid var(--border);
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-option:hover {
            border-color: var(--primary);
            background-color: #f0f7fa;
            color: var(--primary);
        }

        .binary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-binary {
            text-align: center;
            justify-content: center;
            font-size: 1rem;
            padding: 12px;
            border-radius: 10px;
            background: #ffffff;
            border: 1.5px solid var(--border);
            font-weight: 600;
            cursor: pointer;
        }

        .btn-binary:hover {
            border-color: var(--primary);
            background-color: #f0f7fa;
        }

        .notice-card {
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            line-height: 1.4;
            font-weight: 600;
        }

        .notice-card.urgent {
            background-color: #fef2f2;
            border-left: 5px solid var(--danger);
            color: #991b1b;
        }

        .notice-card.success {
            background-color: #f0fdf4;
            border-left: 5px solid var(--secondary);
            color: #166534;
        }

        .btn-action {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            width: 100%;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }

        .report-header {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1e293b;
            text-align: center;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-hero">
            <h1>Aconselhamento de Produtos de Saúde na Menopausa</h1>
            <p>Triagem orientada segundo o protocolo oficial de intervenção farmacêutica</p>
        </div>

        <div class="content" id="appContent">
            <!-- Conteúdo carregado via JS -->
        </div>
    </div>

    <script>
        const treeData = {
            start: {
                tag: "Triagem Inicial",
                title: "A utente apresenta sintomas associados à menopausa?",
                binary: true,
                yes: { next: "q_idade" },
                no: { result: "Sem indicação para aplicação do protocolo de menopausa." }
            },
            q_idade: {
                tag: "Avaliação de Idade",
                title: "A utente tem idade inferior a 45 anos?",
                binary: true,
                yes: { result: "Encaminhamento médico para avaliação de menopausa precoce (<45 anos).", urgent: true },
                no: { next: "q_predominante" }
            },
            q_predominante: {
                tag: "Sintoma A Avaliar",
                title: "Qual o sintoma predominante ou principal queixa da utente?",
                options: [
                    { text: "1. Sintomas Vasomotores", next: "vasomotores_1" },
                    { text: "2. Sintomas Geniturinários", next: "genitu_1" },
                    { text: "3. Saúde Óssea", next: "ossea_1" }
                ]
            },

            /* VASOMOTORES */
            vasomotores_1: {
                tag: "Vasomotores",
                title: "Histórico de cancro hormonodependente?",
                binary: true,
                yes: { result: "Não recomendar fitoestrogénios sem avaliação médica.", urgent: true },
                no: { next: "vasomotores_2" }
            },
            vasomotores_2: {
                tag: "Vasomotores",
                advice: "Informar sobre o possível agravamento dos sintomas vasomotores e promover a cessação tabágica.",
                title: "Pretende limitação a alterações do estilo de vida / não farmacológica?",
                binary: true,
                yes: { next: "vasomotores_4" },
                no: { next: "vasomotores_4" }
            },
            vasomotores_4: {
                tag: "Vasomotores",
                title: "Existe limitação à utilização de fitoestrogénios?",
                binary: true,
                yes: { next: "vasomotores_5" },
                no: { result: "Considerar Isoflavonas de soja (Glycine max) 40–72 mg/dia." }
            },
            vasomotores_5: {
                tag: "Vasomotores",
                title: "Apresenta patologia hepática?",
                binary: true,
                yes: { result: "Evitar erva-de-são-cristóvão. Considerar Extrato de Pólen purificado." },
                no: { result: "Considerar Extrato de Pólen purificado OU erva-de-são-cristóvão (Cimicifuga racemosa)." }
            },

            /* GENITURINÁRIO */
            genitu_1: {
                tag: "Geniturinário",
                advice: "Aconselhar higiene íntima adequada e evitar produtos potencialmente irritantes.",
                title: "Apresenta secura, ardor ou desconforto vaginal?",
                binary: true,
                yes: { result: "Hidratantes Vaginais Não Hormonais (Ácido Hialurónico, Pectina ou Ácido Policarbófilo)." },
                no: { result: "Manter higiene íntima adequada." }
            },

            /* SAÚDE ÓSSEA */
            ossea_1: {
                tag: "Saúde Óssea",
                title: "Diagnóstico de osteoporose ou osteopenia?",
                binary: true,
                yes: { result: "Encaminhamento médico e reforço das medidas não farmacológicas.", urgent: true },
                no: { next: "ossea_2" }
            },
            ossea_2: {
                tag: "Saúde Óssea",
                advice: "Considerar treino de força e resistência.",
                title: "Ingestão dietética de Cálcio insuficiente (<1200 mg/dia)?",
                binary: true,
                yes: { result: "Considerar suplementar cálcio para completar a ingestão diária." },
                no: { result: "Manter alimentação equilibrada rica em cálcio." }
            }
        };

        function renderNode(nodeKey) {
            const app = document.getElementById('appContent');
            const node = treeData[nodeKey];

            if (!node) return;

            // Se for ecrã de Resultado Final
            if (node.result) {
                const cardClass = node.urgent ? 'urgent' : 'success';
                app.innerHTML = `
                    <div class="report-header">Recomendações Clínicas da Utente</div>
                    <div class="notice-card ${cardClass}">
                        ${node.result}
                    </div>
                    <button class="btn-action" onclick="renderNode('q_predominante')">➕ Avaliar Outro Sintoma</button>
                    <button class="btn-action" style="background-color: #64748b;" onclick="renderNode('start')">🔄 Nova Utente</button>
                `;
                return;
            }

            // Ecrã normal de pergunta
            let html = `<span class="step-tag">${node.tag}</span>`;

            if (node.advice) {
                html += `<div class="advice-text">${node.advice}</div>`;
            }

            if (node.title) {
                html += `<h2 class="question-title">${node.title}</h2>`;
            }

            if (node.binary) {
                html += `
                    <div class="binary-grid">
                        <button class="btn-binary" onclick="handleSelect('${nodeKey}', 'yes')">Sim</button>
                        <button class="btn-binary" onclick="handleSelect('${nodeKey}', 'no')">Não</button>
                    </div>
                `;
            } else if (node.options) {
                html += `<div class="options-list">`;
                node.options.forEach((opt, idx) => {
                    html += `<button class="btn-option" onclick="handleSelect('${nodeKey}', ${idx})">${opt.text} <span>→</span></button>`;
                });
                html += `</div>`;
            }

            app.innerHTML = html;
        }

        function handleSelect(nodeKey, choice) {
            const node = treeData[nodeKey];
            let target;

            if (node.binary) {
                target = node[choice];
            } else if (node.options) {
                target = node.options[choice];
            }

            if (target.next) {
                renderNode(target.next);
            } else if (target.result) {
                const app = document.getElementById('appContent');
                const cardClass = target.urgent ? 'urgent' : 'success';
                app.innerHTML = `
                    <div class="report-header">Recomendações Clínicas da Utente</div>
                    <div class="notice-card ${cardClass}">
                        ${target.result}
                    </div>
                    <button class="btn-action" onclick="renderNode('q_predominante')">➕ Avaliar Outro Sintoma</button>
                    <button class="btn-action" style="background-color: #64748b;" onclick="renderNode('start')">🔄 Nova Utente</button>
                `;
            }
        }

        renderNode('start');
    </script>

</body>
</html>
